name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore OpenRecordReplay.sln
      - name: Build
        run: dotnet build OpenRecordReplay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test OpenRecordReplay.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish MCP server
        run: dotnet publish src/Rrp.Mcp/Rrp.Mcp.csproj -c Release -r win-x64 --self-contained true -o artifacts/rrp-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: rrp-mcp-win-x64
          path: artifacts/rrp-mcp
