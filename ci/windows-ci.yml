# Activate by moving this file to .github/workflows/ci.yml
name: Windows CI

on:
  push:
    branches: [main, initial-alpha]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/Rrp.Core.Tests/Rrp.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/Rrp.Core.Tests/Rrp.Core.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/Rrp.Core.Tests/Rrp.Core.Tests.csproj -c Release --no-build
      - name: Build Windows adapter
        run: dotnet build src/Rrp.Windows/Rrp.Windows.csproj -c Release
      - name: Publish MCP server
        run: dotnet publish src/Rrp.Mcp/Rrp.Mcp.csproj -c Release -r win-x64 --self-contained true -o artifacts/rrp-mcp
      - name: Upload MCP server
        uses: actions/upload-artifact@v4
        with:
          name: rrp-mcp-win-x64
          path: artifacts/rrp-mcp
          if-no-files-found: error
